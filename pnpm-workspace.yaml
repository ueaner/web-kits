packages:
  - "packages/*"
  - "packages/*/examples"

# pnpm 默认禁止依赖的 install 脚本（防供应链投毒）。
# 这里只放真正需要执行构建脚本的依赖。注意：v11 起这是唯一入口，
# v10 的 onlyBuiltDependencies 已被移除，写了也不会生效。
allowBuilds:
  lefthook: true # 把 lefthook 的 git 集成装进 .git/hooks/
  # sqlite-wasm-miniprogram 的构建用 esbuild；它的 postinstall 只是校验 / 补下载平台二进制，
  # 二进制已经由可选依赖 @esbuild/<平台> 装好，不需要执行
  esbuild: false
