name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not the default shallow clone — `changeset status --since` below
          # needs to diff against the PR's base branch.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test
      - run: pnpm run build
      # publint inspects dist/, which doesn't exist on a clean checkout until build has run.
      - run: pnpm run pub:check
      - name: Require a changeset for changes that should ship in a release
        # Dependabot PRs bump devDeps without a changeset by design — exempt the bot.
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: pnpm exec changeset status --since=origin/${{ github.base_ref }}
