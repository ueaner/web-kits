version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/packages/cross-tab-kit"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/packages/pending-task-kit"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/packages/cross-sqlite-client"
    schedule:
      interval: "weekly"
