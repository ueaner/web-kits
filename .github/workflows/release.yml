name: Release

# per-package tag 触发：<pkg>@<version>（如 cross-tab-kit@0.5.0）。
# 为什么不沿用单 `vX.Y.Z`：合仓后一个 tag 无法唯一确定要发布哪个包。
# 仍然保留"tag 触发 + 干净 checkout + 重新验证 + --provenance"这套可追溯性：
# 发布出去的东西永远能追溯到一个打过 tag、经过审查的提交。
on:
  push:
    tags:
      - "*@*"

# 发布不应被取消：tag 推送触发的发布是终态动作，要么跑完要么报错。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # --provenance 需要 OIDC
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # 下面的 shell 片段里不要在双引号内嵌 `'"'"'` 这类单引号转义惯用法：
      # 该惯用法只在单引号上下文里成立，混进双引号会打乱引号配对、让整个 run 脚本
      # 以 "syntax error near unexpected token" 失败（曾经踩过）。
      - name: Resolve package and version from the tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PKG="${TAG%@*}"
          VER="${TAG##*@}"
          DIR="packages/$PKG"
          if [ ! -f "$DIR/package.json" ]; then
            echo "Tag names package '$PKG' but $DIR/package.json does not exist" >&2
            exit 1
          fi
          {
            echo "pkg=$PKG"
            echo "ver=$VER"
            echo "dir=$DIR"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the tag version matches that package's package.json
        env:
          DIR: ${{ steps.tag.outputs.dir }}
          VER: ${{ steps.tag.outputs.ver }}
        run: |
          pkg_version="$(node -p "require('./$DIR/package.json').version")"
          if [ "$pkg_version" != "$VER" ]; then
            echo "Tag version $VER != $DIR/package.json version $pkg_version" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      # build 必须在 pub:check 与 typecheck 之前：publint 检查 dist/，
      # 而 pending-task-kit 的 test-e2e 直接 import ../dist/index.js（构建产物冒烟测试）。
      # `...` 后缀把 workspace 依赖一起构建：e2e 的 Vite webServer 要解析 dist 里的
      # 裸导入（cross-tab-kit/advanced → 依赖包的 dist/），只 build 本包会解析失败。
      - run: pnpm --filter "${{ steps.tag.outputs.pkg }}..." run build
      - run: pnpm --filter "${{ steps.tag.outputs.pkg }}" run pub:check
      - run: pnpm --filter "${{ steps.tag.outputs.pkg }}" run typecheck
      - run: pnpm --filter "${{ steps.tag.outputs.pkg }}" run lint
      - run: pnpm --filter "${{ steps.tag.outputs.pkg }}" run format:check
      - run: pnpm --filter "${{ steps.tag.outputs.pkg }}" run test

      # 若该包有浏览器 e2e，也必须在这里跑（tag 触发路径要复现 CI 的全部验证）
      - name: Browser e2e (if present)
        if: ${{ steps.tag.outputs.pkg == 'pending-task-kit' }}
        run: |
          # pnpm 默认不跑依赖的 install 脚本，浏览器不会自动下载；
          # 与 ci.yml 一样显式安装（release 是一次性流程，不需要缓存）。
          pnpm --filter "${{ steps.tag.outputs.pkg }}" exec playwright install --with-deps chromium
          pnpm --filter "${{ steps.tag.outputs.pkg }}" run test:e2e

      # 发布前确认所有内部 workspace 依赖的精确版本都已存在于 registry。
      #
      # 这里**不能**从源 package.json 读版本（workspace 依赖写的是 "workspace:*"，会被
      # 版本号正则直接跳过，变成一条永不报错的空检查），也**不能**指望 pub:check 留下
      # tarball——publint 确实会 pack，但它 pack 到临时目录并在结束时清理，包目录下不会
      # 留下 .tgz。正确做法：从兄弟包的 package.json 建"包名 → 版本"映射再核对 registry。
      #
      # 两种失败都 fail closed，但要给出不同的提示：真正的 E404 是"顺序搞错了"，
      # 而查询本身失败（离线、代理、registry 抖动、缓存不可写）不该被误报成"尚未发布"。
      - name: Preflight — internal workspace deps are published
        env:
          DIR: ${{ steps.tag.outputs.dir }}
        run: |
          node -e '
          const fs=require("fs"),{execSync}=require("child_process");
          const map={};
          for(const d of fs.readdirSync("packages")){
            const p=`packages/${d}/package.json`;
            if(fs.existsSync(p)){const j=JSON.parse(fs.readFileSync(p,"utf8"));map[j.name]=j.version;}
          }
          const pkg=JSON.parse(fs.readFileSync(process.env.DIR+"/package.json","utf8"));
          for(const [name] of Object.entries(pkg.dependencies||{})){
            const v=map[name];
            if(!v) continue; // 不是 workspace 依赖，跳过
            try{
              execSync(`npm view ${name}@${v} version --registry=https://registry.npmjs.org`,{stdio:"pipe",encoding:"utf8",timeout:15000});
            }catch(err){
              const detail=String((err&&err.stderr)||(err&&err.message)||err);
              if(/E404|No matching version|is not in this registry/i.test(detail)){
                console.error(`✗ ${name}@${v} 在 registry 上不存在——请先推被依赖包的 tag，发布完成后再推这个`);
              }else{
                console.error(`✗ 无法确认 ${name}@${v} 是否已发布（registry 查询本身失败，原因见下）:`);
                console.error(detail.trim().slice(0,800));
              }
              process.exit(1);
            }
          }
          console.log("✓ 所有内部依赖已就位");
          '

      # --no-git-checks：CI 的 detached-HEAD tag checkout 下，pnpm publish 自身的
      # git 洁净/分支检查没有意义；上面那次干净 checkout 的 tag 才是真正的可追溯性保证。
      #
      # 这一步会通过 packages/<pkg>/package.json 的 prepublishOnly 再跑一遍完整验证链，
      # 与上面几行**有意重复**：上面保证 CI 里的 tag 路径可信，prepublishOnly 保证
      # 本地手动 `pnpm --filter <pkg> publish` 同样安全。
      - run: pnpm --filter "${{ steps.tag.outputs.pkg }}" publish --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
